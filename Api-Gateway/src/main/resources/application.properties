spring.application.name=Api-Gateway
server.port=${PORT:8765}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.gateway.server.webmvc.routes[0].id=question-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://Question-Service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/question/**
spring.cloud.gateway.server.webmvc.routes[1].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://Quiz-Service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/quiz/**,/auth/**,/attempts/**,/admin/**
spring.cloud.gateway.server.webmvc.routes[2].id=question-docs
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://Question-Service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/docs/questions
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].id=quiz-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://Quiz-Service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/docs/quizzes
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Questions
springdoc.swagger-ui.urls[0].url=/docs/questions
springdoc.swagger-ui.urls[1].name=Quizzes
springdoc.swagger-ui.urls[1].url=/docs/quizzes
springdoc.swagger-ui.disable-swagger-default-url=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.issuer=quiz-platform
logging.pattern.level=%5p [requestId=%X{requestId}]

jwt.public-key=${JWT_PUBLIC_KEY:}
