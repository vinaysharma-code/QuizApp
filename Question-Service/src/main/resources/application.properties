spring.application.name=Question-Service
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.datasource.url=${QUESTION_DB_URL}
spring.datasource.username=${QUESTION_DB_USERNAME}
spring.datasource.password=${QUESTION_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.issuer=quiz-platform
logging.pattern.level=%5p [requestId=%X{requestId}]

jwt.public-key=${JWT_PUBLIC_KEY:}
