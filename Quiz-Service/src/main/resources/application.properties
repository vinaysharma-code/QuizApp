spring.application.name=Quiz-Service
server.port=${PORT:8082}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.datasource.url=${QUIZ_DB_URL}
spring.datasource.username=${QUIZ_DB_USERNAME}
spring.datasource.password=${QUIZ_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.issuer=quiz-platform
logging.pattern.level=%5p [requestId=%X{requestId}]
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key=${JWT_PRIVATE_KEY:}

session.cookie-secure=${COOKIE_SECURE:true}
account.require-verification=${ACCOUNT_REQUIRE_VERIFICATION:false}

account.public-url=${PUBLIC_APP_URL:http://localhost:8765}
account.mail-from=${MAIL_FROM:no-reply@quiz.local}
account.mail-enabled=${ACCOUNT_MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email delivery must not take active assessments offline. Monitor SMTP separately.
management.health.mail.enabled=false
